server {
    server_tokens off;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    listen 80;
    server_name hr-bg-service;
    root /var/www/html/public;
    index index.php index.html;

    location = / {
        rewrite ^ /index.php?$query_string last;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        fastcgi_param DB_CONNECTION mysql;
        fastcgi_param DB_HOST host.docker.internal;
        fastcgi_param DB_PORT 3306;
        fastcgi_param DB_DATABASE mbw_erp;
        fastcgi_param DB_USERNAME root;
        fastcgi_param DB_PASSWORD "mbw123";

        proxy_connect_timeout       3600;
        proxy_send_timeout          3600;
        proxy_read_timeout          3600;
        send_timeout                3600;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param DB_CONNECTION mysql;
        # fastcgi_param DB_HOST host.docker.internal;
        # fastcgi_param DB_PORT 3306;
        # fastcgi_param DB_DATABASE mbw_erp;
        # fastcgi_param DB_USERNAME root;
        # fastcgi_param DB_PASSWORD "mbw123";
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 3600;
        fastcgi_connect_timeout 3600;
        fastcgi_send_timeout    3600;
    }

    # Deny access to .env and other sensitive files
    location ~ /\.env$ {
        deny all;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
        expires 1y;
        add_header Cache-Control "public";
    }
}
